# ---------------------------------------------------------------------------
# Template reutilizable: Despliegue a Vercel via CLI.
# Orquesta validacion de contexto, pull de configuracion, build de produccion,
# despliegue y verificacion del resultado con URL de preview.
#
# Contrato de inputs:
#   component_name   (required) — Nombre del componente
#   environment_name (optional) — Nombre del environment (default: 'production')
#   node_version     (optional) — Version de Node.js (default: '22')
#
# Contrato de secrets:
#   VERCEL_TOKEN      (required) — Token de la API de Vercel
#   VERCEL_ORG_ID     (required) — ID de la organizacion en Vercel
#   VERCEL_PROJECT_ID (required) — ID del proyecto en Vercel
# ---------------------------------------------------------------------------
name: "Template: Deploy Vercel"

on:
  workflow_call:
    inputs:
      component_name:
        description: "Nombre del componente (ej: g4-retail-frontend)"
        required: true
        type: string
      environment_name:
        description: "Nombre del environment de GitHub"
        required: false
        type: string
        default: production
      node_version:
        description: "Version de Node.js"
        required: false
        type: string
        default: "22"
    secrets:
      VERCEL_TOKEN:
        description: "Token de la API de Vercel"
        required: true
      VERCEL_ORG_ID:
        description: "ID de la organizacion/equipo en Vercel"
        required: true
      VERCEL_PROJECT_ID:
        description: "ID del proyecto en Vercel"
        required: true

permissions:
  contents: read

jobs:
  # ── Job 1: Validacion pre-deploy ─────────────────────────────────────────
  pre-deploy-validation:
    name: "Validar despliegue de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    outputs:
      commit_sha_short: ${{ steps.context.outputs.sha_short }}
      branch_name: ${{ steps.context.outputs.branch }}
      deploy_timestamp: ${{ steps.context.outputs.timestamp }}
      deployer: ${{ steps.context.outputs.actor }}
    steps:
      - name: Obtener metadatos del despliegue
        id: context
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"

      - name: Verificar que los secrets de Vercel estan configurados
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          MISSING=""
          [ -z "$VERCEL_TOKEN" ] && MISSING="${MISSING} VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && MISSING="${MISSING} VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && MISSING="${MISSING} VERCEL_PROJECT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Secrets faltantes:${MISSING}"
            exit 1
          fi
          echo "Secrets de Vercel verificados (presentes y no vacios)"

      - name: Publicar informacion pre-deploy
        run: |
          echo "### Despliegue iniciado — ${{ inputs.component_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Propiedad | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Componente** | \`${{ inputs.component_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ambiente** | \`${{ inputs.environment_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Plataforma** | Vercel |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rama** | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Disparado por** | \`${GITHUB_ACTOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Evento** | \`${GITHUB_EVENT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Node.js** | \`${{ inputs.node_version }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: Build y despliegue a Vercel ───────────────────────────────────
  deploy:
    name: "Desplegar ${{ inputs.component_name }} a Vercel"
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    environment: ${{ inputs.environment_name }}
    outputs:
      deploy_url: ${{ steps.vercel-deploy.outputs.deploy_url }}
    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull de la configuracion del proyecto Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build de produccion via Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Desplegar build a produccion
        id: vercel-deploy
        run: |
          echo "::group::Desplegando ${{ inputs.component_name }} a Vercel produccion"
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Desplegado exitosamente en: $DEPLOY_URL"
          echo "::endgroup::"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Job 3: Verificacion post-deploy ──────────────────────────────────────
  post-deploy-verification:
    name: "Verificar despliegue de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation, deploy]
    if: always()
    steps:
      - name: Evaluar resultado del despliegue
        run: |
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "::error::El despliegue de ${{ inputs.component_name }} fallo con estado: ${{ needs.deploy.result }}"
            exit 1
          fi

      - name: Publicar resumen de despliegue
        if: success()
        run: |
          echo "### Resultado del despliegue — ${{ inputs.component_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etapa | Estado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validacion pre-deploy | :white_check_mark: ${{ needs.pre-deploy-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build y despliegue Vercel | :white_check_mark: ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dato | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL de produccion** | ${{ needs.deploy.outputs.deploy_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit desplegado** | \`${{ needs.pre-deploy-validation.outputs.commit_sha_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rama** | \`${{ needs.pre-deploy-validation.outputs.branch_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Desplegado por** | \`${{ needs.pre-deploy-validation.outputs.deployer }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | \`${{ needs.pre-deploy-validation.outputs.deploy_timestamp }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ambiente** | \`${{ inputs.environment_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
