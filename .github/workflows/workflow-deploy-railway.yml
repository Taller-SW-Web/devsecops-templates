# ---------------------------------------------------------------------------
# Template reutilizable: Despliegue a Railway via CLI + Project Token.
# Orquesta validacion de contexto, checkout, instalacion de CLI,
# despliegue y verificacion del resultado.
#
# Contrato de inputs:
#   component_name   (required) — Nombre del componente
#   environment_name (optional) — Nombre del environment (default: 'production')
#   service_name     (optional) — Nombre del servicio en Railway
#   java_version     (optional) — Version de Java (default: '21')
#
# Contrato de secrets:
#   RAILWAY_TOKEN    (required) — Project Token de Railway (rlwy_proj_...)
# ---------------------------------------------------------------------------
name: "Template: Deploy Railway"

on:
  workflow_call:
    inputs:
      component_name:
        description: "Nombre del componente (ej: ms-retail-backend)"
        required: true
        type: string
      environment_name:
        description: "Nombre del environment de GitHub"
        required: false
        type: string
        default: production
      service_name:
        description: "Nombre del servicio en Railway"
        required: false
        type: string
        default: ""
      java_version:
        description: "Version de Java para compilacion"
        required: false
        type: string
        default: "21"
    secrets:
      RAILWAY_TOKEN:
        description: "Project Token de Railway (rlwy_proj_...)"
        required: true

permissions:
  contents: read

jobs:
  # ── Job 1: Validacion pre-deploy ─────────────────────────────────────────
  pre-deploy-validation:
    name: "Validar despliegue de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    outputs:
      commit_sha_short: ${{ steps.context.outputs.sha_short }}
      branch_name: ${{ steps.context.outputs.branch }}
      deploy_timestamp: ${{ steps.context.outputs.timestamp }}
      deployer: ${{ steps.context.outputs.actor }}
    steps:
      - name: Obtener metadatos del despliegue
        id: context
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "actor=${GITHUB_ACTOR}" >> "$GITHUB_OUTPUT"

      - name: Verificar que el token de Railway esta configurado
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::El secret RAILWAY_TOKEN no esta configurado en el repositorio"
            exit 1
          fi
          echo "Token de Railway verificado (presente y no vacio)"

      - name: Publicar informacion pre-deploy
        run: |
          echo "### Despliegue iniciado — ${{ inputs.component_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Propiedad | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Componente** | \`${{ inputs.component_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ambiente** | \`${{ inputs.environment_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Servicio Railway** | \`${{ inputs.service_name || '(default del proyecto)' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rama** | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Disparado por** | \`${GITHUB_ACTOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Evento** | \`${GITHUB_EVENT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: Despliegue a Railway ──────────────────────────────────────────
  deploy:
    name: "Desplegar ${{ inputs.component_name }} a Railway"
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Verificar conexion con Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "::group::Verificando acceso al proyecto Railway"
          railway status || echo "::warning::No se pudo obtener el status del proyecto (puede ser normal en primer deploy)"
          echo "::endgroup::"

      - name: Ejecutar despliegue
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "::group::Desplegando ${{ inputs.component_name }} a Railway"
          SERVICE="${{ inputs.service_name }}"
          if [ -n "$SERVICE" ]; then
            echo "Servicio objetivo: $SERVICE"
            railway up --ci --service "$SERVICE"
          else
            echo "Usando servicio por defecto del proyecto"
            railway up --ci
          fi
          echo "::endgroup::"

  # ── Job 3: Verificacion post-deploy ──────────────────────────────────────
  post-deploy-verification:
    name: "Verificar despliegue de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    needs: [pre-deploy-validation, deploy]
    if: always()
    steps:
      - name: Evaluar resultado del despliegue
        run: |
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "::error::El despliegue de ${{ inputs.component_name }} fallo con estado: ${{ needs.deploy.result }}"
            exit 1
          fi

      - name: Publicar resumen de despliegue
        if: success()
        run: |
          echo "### Resultado del despliegue — ${{ inputs.component_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etapa | Estado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validacion pre-deploy | :white_check_mark: ${{ needs.pre-deploy-validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Despliegue Railway | :white_check_mark: ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dato | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit desplegado** | \`${{ needs.pre-deploy-validation.outputs.commit_sha_short }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rama** | \`${{ needs.pre-deploy-validation.outputs.branch_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Desplegado por** | \`${{ needs.pre-deploy-validation.outputs.deployer }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | \`${{ needs.pre-deploy-validation.outputs.deploy_timestamp }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ambiente** | \`${{ inputs.environment_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
