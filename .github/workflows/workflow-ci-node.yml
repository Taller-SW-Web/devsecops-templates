# ---------------------------------------------------------------------------
# Template reutilizable: Integracion Continua para proyectos Node.js + Vite.
# Orquesta validacion de contexto, instalacion de dependencias, linting,
# tests unitarios, compilacion y publicacion de artefactos.
#
# Contrato de inputs:
#   component_name  (required) — Nombre del componente
#   node_version    (optional) — Version de Node.js (default: '22')
#   build_env_vars  (optional) — Variables de entorno para build (JSON)
# ---------------------------------------------------------------------------
name: "Template: CI Node"

on:
  workflow_call:
    inputs:
      component_name:
        description: "Nombre del componente (ej: g4-retail-frontend)"
        required: true
        type: string
      node_version:
        description: "Version de Node.js"
        required: false
        type: string
        default: "22"
      build_env_vars:
        description: "Variables de entorno para el build en formato JSON"
        required: false
        type: string
        default: "{}"

permissions:
  contents: read

jobs:
  # ── Job 1: Validacion de contexto ────────────────────────────────────────
  validation:
    name: "Validar contexto de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    outputs:
      commit_sha_short: ${{ steps.context.outputs.sha_short }}
      branch_name: ${{ steps.context.outputs.branch }}
      build_timestamp: ${{ steps.context.outputs.timestamp }}
    steps:
      - name: Obtener metadatos del contexto
        id: context
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Resumen del componente
        run: |
          echo "### Contexto de ejecucion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Propiedad | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Componente** | \`${{ inputs.component_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Rama** | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Actor** | \`${GITHUB_ACTOR}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Evento** | \`${GITHUB_EVENT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Node.js** | \`${{ inputs.node_version }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Job 2: Instalacion de dependencias ───────────────────────────────────
  install:
    name: "Instalar dependencias de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Cachear node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ── Job 3: Tests unitarios ───────────────────────────────────────────────
  test:
    name: "Tests unitarios de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    needs: [validation, install]
    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Restaurar node_modules desde cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ejecutar tests unitarios (Vitest)
        run: npm test

  # ── Job 4: Compilacion de produccion ─────────────────────────────────────
  build:
    name: "Compilar ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    needs: [validation, install]
    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Restaurar node_modules desde cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Compilar aplicacion (tsc + vite build)
        run: npm run build
        env:
          VITE_USE_MOCKS: "true"

      - name: Publicar artefacto de compilacion
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component_name }}-dist-${{ needs.validation.outputs.commit_sha_short }}
          path: dist/
          retention-days: 14

  # ── Job 5: Resumen de resultados ─────────────────────────────────────────
  status-check:
    name: "Estado CI de ${{ inputs.component_name }}"
    runs-on: ubuntu-latest
    needs: [validation, install, test, build]
    if: always()
    steps:
      - name: Evaluar resultado de la pipeline
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Pipeline CI fallida — tests: ${{ needs.test.result }}, build: ${{ needs.build.result }}"
            exit 1
          fi

      - name: Publicar resumen de CI
        if: success()
        run: |
          echo "### Resultado CI — ${{ inputs.component_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Etapa | Estado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validacion | :white_check_mark: ${{ needs.validation.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependencias | :white_check_mark: ${{ needs.install.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests unitarios | :white_check_mark: ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compilacion | :white_check_mark: ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Commit \`${{ needs.validation.outputs.commit_sha_short }}\` en rama \`${{ needs.validation.outputs.branch_name }}\` — ${{ needs.validation.outputs.build_timestamp }}" >> "$GITHUB_STEP_SUMMARY"
