# Template reutilizable: CD a Vercel via CLI.
# Se invoca desde repos que despliegan su frontend en Vercel.
# Requisitos en el repo que llama:
#   - Secret VERCEL_TOKEN
#   - Secret VERCEL_ORG_ID
#   - Secret VERCEL_PROJECT_ID
name: CD Vercel (template)

on:
  workflow_call:
    inputs:
      environment:
        description: "Nombre del environment de GitHub (ej: production, staging)"
        required: false
        type: string
        default: production
      node-version:
        description: "Version de Node.js"
        required: false
        type: string
        default: "22"
      build-env:
        description: "Variables de entorno para el build (JSON key-value, ej: '{\"VITE_API_URL\":\"https://api.example.com\"}')"
        required: false
        type: string
        default: "{}"
    secrets:
      VERCEL_TOKEN:
        description: "Token de la API de Vercel"
        required: true
      VERCEL_ORG_ID:
        description: "ID de la organizacion/equipo en Vercel"
        required: true
      VERCEL_PROJECT_ID:
        description: "ID del proyecto en Vercel"
        required: true

jobs:
  deploy:
    name: Deploy a Vercel
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Node ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull de la configuracion de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build de produccion
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy a produccion
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Desplegado en: $DEPLOY_URL"
          echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

