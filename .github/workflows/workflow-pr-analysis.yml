name: Pull Request Security and Code Quality
on:
  workflow_call:
    inputs:
      component_name:
        required: true
        type: string
      technology:
        description: maven or node
        required: true
        type: string
      language:
        description: java for Maven; javascript or typescript for Node
        required: true
        type: string
      sonar_organization:
        description: Optional SonarQube Cloud organization; defaults to the GitHub owner in lowercase
        type: string
        default: ''
      sonar_host_url:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  build_test:
    name: Build, Unit Tests and Policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      blocking: ${{ steps.policy.outputs.blocking }}
      codeql_language: ${{ steps.policy.outputs.codeql_language }}
      codeql_build_mode: ${{ steps.policy.outputs.codeql_build_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Shared Shell Scripts
        uses: actions/checkout@v4
        with:
          repository: Taller-SW-Web/devsecops-templates
          ref: main
          path: .devsecops-templates
          persist-credentials: false
      - name: Validate Analysis Context and Policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          LANGUAGE: ${{ inputs.language }}
        run: bash .devsecops-templates/scripts/analysis/validate-pr-context.sh
      - uses: Taller-SW-Web/github-actions/analysis-validator@main
        id: policy
        with:
          technology: ${{ inputs.technology }}
          language: ${{ inputs.language }}
      - uses: actions/setup-java@v4
        if: inputs.technology == 'maven'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        if: inputs.technology == 'node'
        with:
          node-version: '22.22.2'
          cache: npm
      - name: Build and Coverage (Maven)
        if: inputs.technology == 'maven'
        run: bash .devsecops-templates/scripts/analysis/maven-test-coverage.sh
      - name: Build and Coverage (Node)
        if: inputs.technology == 'node'
        run: |
          bash .devsecops-templates/scripts/analysis/node-test-coverage.sh
          npm run build
      - name: Publish Build, JAR/Dist and Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-coverage-${{ github.run_attempt }}
          path: |
            target/classes/
            target/test-classes/
            target/site/jacoco/
            target/surefire-reports/
            target/*.jar
            coverage/
            dist/
            reports/
          if-no-files-found: error
          retention-days: 14
  sonar_analysis:
    name: SonarQube - SAST and Code Quality
    needs: [build_test]
    if: needs.build_test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      outcome: ${{ steps.outcome.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Shared Shell Scripts
        uses: actions/checkout@v4
        with:
          repository: Taller-SW-Web/devsecops-templates
          ref: main
          path: .devsecops-templates
          persist-credentials: false
      - name: Check SonarQube Configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        run: bash .devsecops-templates/scripts/analysis/validate-sonar-config.sh
      - name: Derive Project Identity
        id: project
        uses: actions/github-script@v7
        env:
          SONAR_SERVER: ${{ inputs.sonar_host_url }}
          SONAR_ORGANIZATION: ${{ inputs.sonar_organization }}
        with:
          script: |
            const host = new URL(process.env.SONAR_SERVER).hostname;
            if (['sonarcloud.io', 'sonarqube.us'].includes(host)) {
              const organization = process.env.SONAR_ORGANIZATION || context.repo.owner.toLowerCase();
              if (!/^[a-zA-Z0-9_.:-]+$/.test(organization)) throw new Error('Invalid SonarQube Cloud organization key');
              core.setOutput('organization_argument', `-Dsonar.organization=${organization}`);
            }
            core.setOutput('key', `${context.repo.owner}_${context.repo.repo}`);
      - uses: actions/setup-java@v4
        if: inputs.technology == 'maven'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        if: inputs.technology == 'node'
        with:
          node-version: '22.22.2'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: build-coverage-${{ github.run_attempt }}
          path: .
      - name: Analizar Java con scanner Maven
        if: inputs.technology == 'maven'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
          SONAR_PROJECT_KEY: ${{ steps.project.outputs.key }}
          SONAR_ORGANIZATION_ARGUMENT: ${{ steps.project.outputs.organization_argument }}
        run: bash .devsecops-templates/scripts/analysis/maven-sonar.sh
      - name: SonarQube JavaScript and TypeScript Analysis
        if: inputs.technology == 'node'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar_host_url }}
        with:
          args: >-
            ${{ steps.project.outputs.organization_argument }}
            -Dsonar.projectKey=${{ steps.project.outputs.key }}
            -Dsonar.sources=src
            -Dsonar.exclusions=**/*.test.*,**/*.spec.*
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=false
      - name: Publish Scanner Task Metadata
        uses: actions/upload-artifact@v4
        with:
          name: sonar-task-${{ github.run_attempt }}
          path: ${{ inputs.technology == 'maven' && 'target/sonar/report-task.txt' || '.scannerwork/report-task.txt' }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Record Actual Analysis Outcome
        id: outcome
        if: always()
        env:
          RAW_STATUS: ${{ job.status }}
          SUMMARY_TEXT: |-
            ### SonarQube scan
            Execution: **${{ job.status }}**. Quality Gate is evaluated separately.
        run: bash .devsecops-templates/scripts/analysis/record-analysis-outcome.sh
  sonar_gate:
    name: SonarQube - Quality Gate and Metrics
    needs: [build_test, sonar_analysis]
    if: ${{ !cancelled() && needs.build_test.result == 'success' && needs.sonar_analysis.outputs.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      outcome: ${{ steps.outcome.outputs.value }}
      gate: ${{ steps.gate.outputs.gate }}
    steps:
      - name: Checkout Shared Shell Scripts
        uses: actions/checkout@v4
        with:
          repository: Taller-SW-Web/devsecops-templates
          ref: main
          path: .devsecops-templates
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sonar-task-${{ github.run_attempt }}
          path: sonar-task
      - name: Evaluate Quality Gate for This Analysis
        id: gate
        uses: Taller-SW-Web/github-actions/security-report@main
        with:
          mode: sonar
          sonar_host_url: ${{ inputs.sonar_host_url }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
      - name: Publish Quality Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-quality-gate-${{ github.run_attempt }}
          path: sonar-quality-gate.json
          retention-days: 14
      - name: Record Actual Gate Outcome
        id: outcome
        if: always()
        env:
          RAW_STATUS: ${{ job.status }}
          SUMMARY_TEXT: |-
            Quality Gate execution: **${{ job.status }}**. If no metrics were produced, inspect the API/configuration error in this job.
        run: bash .devsecops-templates/scripts/analysis/record-analysis-outcome.sh
  ghas_sast:
    name: GHAS - SAST / CodeQL (${{ inputs.language }})
    needs: build_test
    if: needs.build_test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    outputs:
      outcome: ${{ steps.outcome.outputs.value }}
      high: ${{ steps.gate.outputs.high }}
      critical: ${{ steps.gate.outputs.critical }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Shared Shell Scripts
        uses: actions/checkout@v4
        with:
          repository: Taller-SW-Web/devsecops-templates
          ref: main
          path: .devsecops-templates
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: inputs.technology == 'maven'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize Language-Specific CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ needs.build_test.outputs.codeql_language }}
          build-mode: ${{ needs.build_test.outputs.codeql_build_mode }}
          queries: security-extended
      - name: Extract Compiled Java Code
        if: inputs.technology == 'maven'
        run: bash .devsecops-templates/scripts/analysis/maven-codeql-extract.sh
      - name: Analyze and Publish Code Scanning Results
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: retail-pr-${{ inputs.language }}
          output: codeql-results
          upload: always
          wait-for-processing: true
      - name: Evaluate High and Critical Security Findings
        id: gate
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        uses: Taller-SW-Web/github-actions/security-report@main
        with:
          mode: sarif
      - name: Publish SARIF and Severity Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghas-sast-${{ inputs.language }}-${{ github.run_attempt }}
          path: codeql-results/
          retention-days: 14
      - name: Record Actual SAST Outcome
        id: outcome
        if: always()
        env:
          RAW_STATUS: ${{ job.status }}
          SUMMARY_TEXT: |-
            GHAS SAST execution: **${{ job.status }}**. SARIF, when generated, is attached to this run.
        run: bash .devsecops-templates/scripts/analysis/record-analysis-outcome.sh
  ghas_sca:
    name: GHAS - SCA / Dependency Review
    needs: build_test
    if: ${{ github.event_name == 'pull_request' && needs.build_test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      outcome: ${{ steps.outcome.outputs.value }}
      vulnerabilities: ${{ steps.export.outputs.vulnerabilities }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Shared Shell Scripts
        uses: actions/checkout@v4
        with:
          repository: Taller-SW-Web/devsecops-templates
          ref: main
          path: .devsecops-templates
          persist-credentials: false
      - name: Determine Dependency Comparison Base
        id: comparison
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$BEFORE}"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Review Dependency Changes and Vulnerabilities
        id: review
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ steps.comparison.outputs.base }}
          head-ref: ${{ github.sha }}
          fail-on-severity: high
          comment-summary-in-pr: never
          show-patched-versions: true
      - name: Export Dependency Findings
        id: export
        if: always()
        uses: actions/github-script@v7
        env:
          DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
          VULNERABLE_CHANGES: ${{ steps.review.outputs.vulnerable-changes }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const parse = value => value ? JSON.parse(value) : null;
            const report = { outcome: process.env.REVIEW_OUTCOME,
              changes: parse(process.env.DEPENDENCY_CHANGES), vulnerabilities: parse(process.env.VULNERABLE_CHANGES) };
            fs.writeFileSync('dependency-review.json', JSON.stringify(report, null, 2));
            if (Array.isArray(report.vulnerabilities)) core.setOutput('vulnerabilities', report.vulnerabilities.length);
            await core.summary.addHeading('GHAS SCA · Dependency Review')
              .addRaw(`Execution: ${report.outcome}. Policy: high/critical introduced vulnerabilities. Full details: dependency-review.json artifact.\n`).write();
      - name: Publish Dependency Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghas-sca-${{ github.run_attempt }}
          path: dependency-review.json
          retention-days: 14
      - name: Record Actual SCA Outcome
        id: outcome
        if: always()
        env:
          RAW_STATUS: ${{ job.status }}
        run: bash .devsecops-templates/scripts/analysis/record-job-outcome.sh
  supply_chain:
    name: Secrets and Full SCA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Secrets (Redacted)
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:3775e3b6463f02763d67d4e837c7316d300a57108831707db9ed208883e26bb6 \
            git /repo --redact=100 --no-banner --exit-code=1
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() && inputs.technology == 'maven' }}
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: SCA Maven (OWASP Dependency-Check)
        id: maven
        if: ${{ !cancelled() && inputs.technology == 'maven' }}
        run: >-
          bash ./mvnw -B org.owasp:dependency-check-maven:13.0.0:check
          -Dformat=JSON -DfailBuildOnCVSS=7 -DfailOnError=true
          -Dodc.outputDirectory=reports/security
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && inputs.technology == 'node' }}
        with:
          node-version: '22.22.2'
          cache: npm
      - name: SCA npm (Audit Lockfile)
        id: npm
        if: ${{ !cancelled() && inputs.technology == 'node' }}
        run: |
          set -euo pipefail
          mkdir -p reports/security
          npm audit --package-lock-only --audit-level=high --json > reports/security/npm-audit.json
      - name: Sanitized Supply Chain Summary
        if: always()
        uses: actions/github-script@v7
        env:
          SECRET_STATUS: ${{ steps.secrets.outcome }}
          SCA_STATUS: ${{ inputs.technology == 'maven' && steps.maven.outcome || steps.npm.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('reports/security', {recursive:true});
            const report = {sha:context.sha, run_id:context.runId, attempt:process.env.GITHUB_RUN_ATTEMPT,
              secrets:process.env.SECRET_STATUS, sca:process.env.SCA_STATUS};
            fs.writeFileSync('reports/security/summary.json', JSON.stringify(report,null,2));
            const icon = v => v === 'success' ? '✅ success' : v === 'skipped' ? '⏭️ skipped' : `❌ ${v}`;
            await core.summary
              .addHeading('🔐 Supply Chain · Secretos y SCA completo')
              .addTable([
                ['Control', 'Herramienta', 'Resultado'],
                ['Secret Scanning', 'Gitleaks v8.24.2 (redactado)', icon(report.secrets)],
                ['SCA Completo', '${{ inputs.technology }}' === 'maven' ? 'OWASP Dependency-Check' : 'npm audit (lockfile)', icon(report.sca)]
              ])
              .addRaw(`\nCommit: \`${context.sha.slice(0, 7)}\` · Run: \`${context.runId}\` (attempt ${report.attempt})\n`)
              .write();
            if (report.secrets !== 'success' || report.sca !== 'success') core.setFailed('Análisis incompleto o bloqueante.');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-${{ github.run_attempt }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 14
  status:
    name: Security Policy Result
    needs: [build_test, sonar_analysis, sonar_gate, ghas_sast, ghas_sca, supply_chain]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish Actions Summary and Update PR Comment
        uses: Taller-SW-Web/github-actions/security-report@main
        with:
          mode: pull-request
          results: ${{ toJSON(needs) }}
          technology: ${{ inputs.technology }}
          language: ${{ inputs.language }}
          sonar_host_url: ${{ inputs.sonar_host_url }}
      - name: Publish Consolidated Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-security-report-${{ github.run_attempt }}
          path: pr-security-report.md
          retention-days: 14
