# Template reutilizable: CD a Railway via Railway CLI + Project Token.
# Se invoca desde repos que despliegan su backend en Railway.
# Requisitos en el repo que llama:
#   - Secret RAILWAY_TOKEN    (Project Token generado en Railway)
#   - Variable RAILWAY_SERVICE (nombre del servicio en el proyecto de Railway)
name: CD Railway (template)

on:
  workflow_call:
    inputs:
      environment:
        description: "Nombre del environment de GitHub (ej: production, staging)"
        required: false
        type: string
        default: production
      service:
        description: "Nombre del servicio en Railway (alternativa a la variable RAILWAY_SERVICE)"
        required: false
        type: string
        default: ""
    secrets:
      RAILWAY_TOKEN:
        description: "Project Token de Railway (rlwy_proj_...)"
        required: true
      RAILWAY_SERVICE:
        description: "Nombre del servicio en Railway (si no se pasa como input)"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy a Railway
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy a Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          SERVICE="${{ inputs.service || secrets.RAILWAY_SERVICE }}"
          echo "::group::Desplegando servicio: $SERVICE"
          if [ -n "$SERVICE" ]; then
            railway up --ci --service "$SERVICE"
          else
            railway up --ci
          fi
          echo "Deploy completado exitosamente"
          echo "::endgroup::"
