# Template reutilizable: CD a Railway via deploy hook.
# Se invoca desde repos que despliegan su backend en Railway.
# Requisitos en el repo que llama:
#   - Secret RAILWAY_DEPLOY_HOOK_URL (webhook de redeploy del servicio en Railway)
name: CD Railway (template)

on:
  workflow_call:
    inputs:
      environment:
        description: "Nombre del environment de GitHub (ej: production, staging)"
        required: false
        type: string
        default: production
      wait-for-healthy:
        description: "Segundos a esperar para verificar el health check despues del deploy"
        required: false
        type: number
        default: 120
      health-url:
        description: "URL del health check (vacia = no verificar)"
        required: false
        type: string
        default: ""
    secrets:
      RAILWAY_DEPLOY_HOOK_URL:
        description: "Webhook URL de Railway para disparar el redeploy"
        required: true

jobs:
  deploy:
    name: Deploy a Railway
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Disparar redeploy en Railway
        run: |
          echo "::group::Disparando deploy hook de Railway"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}")
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Railway respondio con HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Deploy disparado exitosamente"
          echo "::endgroup::"

      - name: Esperar y verificar health check
        if: inputs.health-url != ''
        run: |
          echo "Esperando ${{ inputs.wait-for-healthy }}s para que Railway levante el servicio..."
          sleep ${{ inputs.wait-for-healthy }}
          echo "::group::Verificando health check"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "${{ inputs.health-url }}")
          echo "Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::warning::Health check respondio con HTTP $HTTP_STATUS (el servicio puede estar aun levantando)"
          else
            echo "Servicio saludable"
          fi
          echo "::endgroup::"

