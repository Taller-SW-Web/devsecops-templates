name: Continuous Integration and Quality Analysis
on:
  workflow_call:
    inputs:
      component_name:
        required: true
        type: string
      technology:
        required: true
        type: string
      source_sha:
        type: string
        default: ''
      sonar_organization:
        description: Optional SonarQube Cloud organization; defaults to the GitHub owner in lowercase
        type: string
        default: ''
      sonar_host_url:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  verify_sha:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar identidad del candidato
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$SOURCE_SHA" = "$GITHUB_SHA"
  quality:
    needs: verify_sha
    uses: ./.github/workflows/workflow-pr-analysis.yml
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: write
    with:
      component_name: ${{ inputs.component_name }}
      technology: ${{ inputs.technology }}
      language: ${{ inputs.technology == 'maven' && 'java' || 'typescript' }}
      sonar_organization: ${{ inputs.sonar_organization }}
      sonar_host_url: ${{ inputs.sonar_host_url }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
